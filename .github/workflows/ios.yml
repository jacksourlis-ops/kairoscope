name: Build iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
      - name: Add iOS platform
        run: npx cap add ios
      - name: Copy web assets
        run: npx cap copy ios
      - name: Install CocoaPods
        run: cd ios/App && pod install
      - name: Setup signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.cer
          echo "$PRIVATE_KEY" > private_key.pem
          openssl x509 -inform DER -in certificate.cer -out certificate.pem
          openssl pkcs12 -export -out certificate.p12 -inkey private_key.pem -in certificate.pem -passout pass:kairoscope123
          security create-keychain -p "build123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build123" build.keychain
          security import certificate.p12 -k build.keychain -P kairoscope123 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build123" build.keychain
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Create ExportOptions
        run: |
          cat > ios/App/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>3QK76574S3</string>
          </dict>
          </plist>
          PLIST
      - name: Build iOS app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath ios/App/App.xcarchive archive
      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath ios/App/App.xcarchive -exportPath ios/App/output -exportOptionsPlist ios/App/ExportOptions.plist
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kairoscope-ios
          path: ios/App/output/*.ipa
